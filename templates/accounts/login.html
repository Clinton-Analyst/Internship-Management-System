{% extends "base.html" %}

{% block content %}
<style>
    .login-form input:not([type="hidden"]) {
        width: 100%;
        border: 2px solid #6b7280;
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
    }
    .login-form input:not([type="hidden"]):focus {
        border-color: #2563eb;
        outline: 3px solid rgb(37 99 235 / 25%);
        outline-offset: 1px;
    }
</style>
<div class="min-h-[calc(100vh-6rem)] flex items-center justify-center">
    <section class="w-full max-w-sm rounded-lg bg-white p-8 shadow-md">
        <h1 class="mb-6 text-center text-2xl font-bold">Log in</h1>
        <form method="post" class="login-form space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="w-full rounded bg-blue-600 px-4 py-2 text-white">
                Log in
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            New student?
            <a href="{% url 'register' %}" class="font-semibold text-blue-700 underline">Create an account</a>
        </p>
        <p class="mt-2 text-center text-sm text-gray-600">
            Supervisor?
            <a href="{% url 'register_supervisor' %}" class="font-semibold text-blue-700 underline">Register here</a>
        </p>
    </section>
</div>
{% endblock %}
