{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Log in</h1>
<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white">
        Log in
    </button>
</form>
{% endblock %}
